<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    h1 { text-align: center; margin-bottom: 20px; color: #1f2937; }

    #todo-form { display: flex; gap: 8px; margin-bottom: 16px; }

    #todo-input {
      flex: 1;
      padding: 10px 12px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    #todo-input:focus { border-color: #4f46e5; }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.95rem;
      background: #4f46e5;
      color: #fff;
      transition: background 0.2s;
    }
    button:hover { background: #4338ca; }

    ul { list-style: none; max-height: 300px; overflow-y: auto; }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid #f3f4f6;
    }
    li span { flex: 1; color: #374151; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #9ca3af; }

    li .delete { background: transparent; color: #ef4444; padding: 4px 8px; font-size: 1.1rem; }
    li .delete:hover { background: #fee2e2; }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      color: #6b7280;
      font-size: 0.9rem;
    }
    #clear-done { background: #f3f4f6; color: #374151; }
    #clear-done:hover { background: #e5e7eb; }
  </style>
</head>
<body>
  <main class="card">
    <h1>My To-Do List</h1>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <footer>
      <span id="count">0 tasks left</span>
      <button id="clear-done" type="button">Clear completed</button>
    </footer>
  </main>

  <script>
    const form = document.getElementById("todo-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const count = document.getElementById("count");
    const clearDone = document.getElementById("clear-done");

    let todos = JSON.parse(localStorage.getItem("todos")) || [];

    function save() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = "";

      todos.forEach((todo) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todo.done = checkbox.checked;
          save();
          render();
        });

        const text = document.createElement("span");
        text.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "✕";
        del.addEventListener("click", () => {
          todos = todos.filter((t) => t.id !== todo.id);
          save();
          render();
        });

        li.append(checkbox, text, del);
        list.appendChild(li);
      });

      const left = todos.filter((t) => !t.done).length;
      count.textContent = `${left} task${left === 1 ? "" : "s"} left`;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const value = input.value.trim();
      if (!value) return;

      todos.push({ id: Date.now(), text: value, done: false });
      input.value = "";
      save();
      render();
    });

    clearDone.addEventListener("click", () => {
      todos = todos.filter((t) => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
